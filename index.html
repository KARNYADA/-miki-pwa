<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MIKI">
  <meta name="theme-color" content="#08080f">
  <title>MIKI</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root {
  --bg:#08080f; --bg2:#0e0e1c; --surface:rgba(255,255,255,.045);
  --border:rgba(255,255,255,.07); --accent:#00e5b0; --amber:#f59e0b;
  --red:#ef4444; --purple:#a855f7; --text:#eeeef5; --muted:rgba(238,238,245,.38);
  --glow-g:0 0 40px rgba(0,229,176,.22); --glow-a:0 0 30px rgba(245,158,11,.35);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100svh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 55% 35% at 15% 10%,rgba(0,229,176,.07) 0%,transparent 55%),radial-gradient(ellipse 40% 55% at 85% 90%,rgba(91,33,182,.09) 0%,transparent 55%);pointer-events:none}
.shell{position:relative;max-width:420px;margin:0 auto;padding:0 20px 120px}
.header{display:flex;align-items:center;justify-content:space-between;padding:56px 0 20px}
.wordmark{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;letter-spacing:6px;color:var(--accent);text-shadow:0 0 24px rgba(0,229,176,.45)}
.pill{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:24px;background:var(--surface);border:1px solid var(--border);font-size:10px;font-weight:600;letter-spacing:1.2px;color:var(--muted);transition:all .35s;cursor:default;user-select:none}
.pill.ok{color:var(--accent);border-color:rgba(0,229,176,.18)}.pill.err{color:var(--red);border-color:rgba(239,68,68,.18)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}.pill.ok .dot{animation:blink 2.4s infinite}
@keyframes blink{0%,100%{opacity:1}55%{opacity:.25}}

/* MIC ZONE */
.mic-zone{display:flex;flex-direction:column;align-items:center;padding:24px 0 20px}
.ripple-wrap{position:relative;width:130px;height:130px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.ripple{position:absolute;border-radius:50%;border:1.5px solid var(--accent);opacity:0;transition:opacity .3s}
.ripple:nth-child(1){inset:0}.ripple:nth-child(2){inset:-14px}.ripple:nth-child(3){inset:-28px}
.ripple-wrap.alive .ripple{animation:ripple-out 2s ease-out infinite}
.ripple-wrap.alive .ripple:nth-child(2){animation-delay:.33s}.ripple-wrap.alive .ripple:nth-child(3){animation-delay:.66s}
@keyframes ripple-out{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.2);opacity:0}}
.mic-btn{width:130px;height:130px;border-radius:50%;background:var(--surface);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);position:relative;z-index:2;outline:none;-webkit-user-select:none;user-select:none}
.mic-btn:active{transform:scale(.93)}.mic-icon{transition:all .3s;color:var(--accent)}
.mic-btn.wake{background:rgba(0,229,176,.1);border-color:var(--accent);box-shadow:var(--glow-g),inset 0 0 20px rgba(0,229,176,.05)}
.mic-btn.off{opacity:.55}
.status-lbl{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);transition:all .3s;min-height:18px}
.status-lbl.alive{color:var(--accent);text-shadow:0 0 12px rgba(0,229,176,.4)}

/* DEBUG STRIP — shows what mic hears */
.debug-strip{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:10px;padding:8px 14px;margin:10px 0 6px;min-height:36px;display:flex;align-items:center;gap:8px}
.debug-ico{font-size:13px;flex-shrink:0;opacity:.5}
.debug-txt{font-size:12px;color:rgba(0,229,176,.6);font-family:monospace;word-break:break-all;line-height:1.4}

.waves{display:flex;align-items:center;gap:3px;height:22px;margin-top:8px;opacity:0;transition:opacity .4s}
.waves.alive{opacity:1}
.bar{width:3px;background:var(--accent);border-radius:2px;animation:none}
.waves.alive .bar{animation:wave .75s ease-in-out infinite alternate}
.bar:nth-child(1){height:6px}.bar:nth-child(2){height:12px}.bar:nth-child(3){height:18px}.bar:nth-child(4){height:22px}.bar:nth-child(5){height:18px}.bar:nth-child(6){height:12px}.bar:nth-child(7){height:6px}
.waves.alive .bar:nth-child(1){animation-delay:.0s}.waves.alive .bar:nth-child(2){animation-delay:.1s}.waves.alive .bar:nth-child(3){animation-delay:.2s}.waves.alive .bar:nth-child(4){animation-delay:.3s}.waves.alive .bar:nth-child(5){animation-delay:.2s}.waves.alive .bar:nth-child(6){animation-delay:.1s}.waves.alive .bar:nth-child(7){animation-delay:.0s}
@keyframes wave{from{transform:scaleY(.3);opacity:.5}to{transform:scaleY(1);opacity:1}}

/* TRANSCRIPT */
.transcript{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 16px;margin:4px 0 24px;min-height:50px;transition:border-color .3s,background .3s}
.transcript.lit{border-color:rgba(0,229,176,.28);background:rgba(0,229,176,.04)}
.tr-ico{font-size:16px;flex-shrink:0}.tr-txt{font-size:13.5px;line-height:1.45;color:var(--muted);font-style:italic;transition:color .3s}
.tr-txt.has{color:var(--text);font-style:normal}

/* SECTION LABEL */
.sec-lbl{font-family:'Syne',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.sec-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}

/* ROOM CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:22px 22px 18px;margin-bottom:14px;transition:all .4s cubic-bezier(.34,1.1,.64,1);position:relative;overflow:hidden}
.card::after{content:'';position:absolute;top:-40%;right:-15%;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.12) 0%,transparent 70%);transition:opacity .5s;opacity:0;pointer-events:none}
.card.on{border-color:rgba(245,158,11,.22);background:rgba(245,158,11,.035)}.card.on::after{opacity:1}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.room-meta{display:flex;align-items:center;gap:14px}
.icon-box{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .4s}
.card.on .icon-box{background:rgba(245,158,11,.14);box-shadow:0 0 18px rgba(245,158,11,.2)}
.room-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.room-state{font-size:11.5px;color:var(--muted);margin-top:3px;transition:color .3s}.card.on .room-state{color:var(--amber)}
.toggle{position:relative;width:54px;height:28px;border-radius:14px;background:rgba(255,255,255,.1);border:none;cursor:pointer;transition:background .35s,box-shadow .35s;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.4);transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .3s}
.toggle.on{background:var(--amber);box-shadow:0 0 14px rgba(245,158,11,.4)}.toggle.on::after{transform:translateX(26px);background:#fff}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act-btn{padding:11px 8px;border-radius:11px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;letter-spacing:.2px}
.act-btn:active{transform:scale(.96)}
.btn-on:hover{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:var(--amber)}
.btn-off:hover{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.2);color:var(--red)}

/* TIMER SECTION */
.timer-add-btn{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;border:1px dashed rgba(0,229,176,.3);background:rgba(0,229,176,.04);color:var(--accent);font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;margin-bottom:14px;width:100%}
.timer-add-btn:hover{background:rgba(0,229,176,.09);border-style:solid}
.timer-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;transition:all .3s}
.timer-card.active-timer{border-color:rgba(168,85,247,.25)}
.timer-time{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--text);min-width:76px}
.timer-ampm{font-size:11px;color:var(--muted);letter-spacing:1px;font-weight:600}
.timer-info{flex:1}
.timer-room{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.timer-action{display:inline-flex;align-items:center;gap:4px;margin-top:3px;font-size:11px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:20px}
.timer-action.on-badge{background:rgba(245,158,11,.15);color:var(--amber)}
.timer-action.off-badge{background:rgba(239,68,68,.1);color:var(--red)}
.timer-toggle{position:relative;width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,.08);border:none;cursor:pointer;transition:background .3s;flex-shrink:0}
.timer-toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.35);transition:transform .3s,background .3s}
.timer-toggle.on{background:var(--purple)}.timer-toggle.on::after{transform:translateX(20px);background:#fff}
.timer-del{width:32px;height:32px;border-radius:8px;border:none;background:rgba(239,68,68,.08);color:rgba(239,68,68,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s;flex-shrink:0}
.timer-del:hover{background:rgba(239,68,68,.18);color:var(--red)}

/* FABs */
.fab-wrap{position:fixed;bottom:30px;right:22px;display:flex;flex-direction:column;gap:10px;z-index:80}
.fab{width:48px;height:48px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s}
.fab:hover{border-color:rgba(0,229,176,.3);background:rgba(0,229,176,.07)}

/* OVERLAY + SHEET */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#101020;border-top:1px solid var(--border);border-radius:24px 24px 0 0;padding:20px 22px 50px;z-index:100;transform:translateY(100%);transition:transform .4s cubic-bezier(.34,1.1,.64,1);max-width:420px;margin:0 auto}
.sheet.open{transform:translateY(0)}
.handle{width:38px;height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin:0 auto 22px}
.sheet-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:2.5px;color:var(--accent);margin-bottom:18px;text-transform:uppercase}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:10.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fld input,.fld select{width:100%;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:14px;outline:none;transition:border-color .2s;appearance:none;-webkit-appearance:none}
.fld input:focus,.fld select:focus{border-color:rgba(0,229,176,.4)}
.fld input::placeholder{color:rgba(255,255,255,.2)}
.fld select option{background:#101020;color:var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.save-btn{width:100%;padding:14px;margin-top:6px;background:var(--accent);color:#000;border:none;border-radius:12px;font-family:'Syne',sans-serif;font-size:13px;font-weight:800;letter-spacing:2.5px;cursor:pointer;transition:all .2s}
.save-btn:hover{filter:brightness(1.08);box-shadow:var(--glow-g)}.save-btn:active{transform:scale(.97)}

/* TIME PICKER GRID */
.time-grid{display:grid;grid-template-columns:1fr auto 1fr auto;gap:6px;align-items:center;margin-bottom:12px}
.time-unit{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 0;text-align:center;font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--text);position:relative;overflow:hidden}
.time-unit input{background:transparent;border:none;outline:none;width:100%;text-align:center;font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--text);padding:0 10px}
.time-colon{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:var(--muted);text-align:center}
.ampm-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.ampm-btn{padding:10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .2s}
.ampm-btn.sel{background:rgba(0,229,176,.12);border-color:rgba(0,229,176,.4);color:var(--accent)}
.action-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.action-btn{padding:11px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:1px}
.action-btn.sel-on{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.4);color:var(--amber)}
.action-btn.sel-off{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:var(--red)}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:rgba(14,14,28,.9);border:1px solid rgba(0,229,176,.25);backdrop-filter:blur(16px);color:var(--accent);padding:10px 22px;border-radius:30px;font-size:13px;font-weight:500;z-index:200;transition:transform .4s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
@keyframes cmd-flash{0%,100%{}40%{box-shadow:0 0 60px rgba(245,158,11,.6),var(--glow-a)}}
.card.flash{animation:cmd-flash .6s ease-out}
</style>
</head>
<body>
<div class="shell">

  <div class="header">
    <div class="wordmark">MIKI</div>
    <div class="pill" id="connPill"><div class="dot"></div><span id="connTxt">CONNECTING</span></div>
  </div>

  <!-- MIC -->
  <div class="mic-zone">
    <div class="ripple-wrap" id="rippleWrap">
      <div class="ripple"></div><div class="ripple"></div><div class="ripple"></div>
      <button class="mic-btn" id="micBtn" onclick="toggleMic()" aria-label="Mic">
        <svg id="micSvg" class="mic-icon" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
    </div>
    <div class="status-lbl" id="statusLbl">TAP TO START</div>
    <div class="waves" id="waves">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
  </div>

  <!-- DEBUG STRIP — live transcription dikh raha hai -->
  <div class="debug-strip" id="debugStrip">
    <span class="debug-ico">👂</span>
    <span class="debug-txt" id="debugTxt">Sun raha hun... "miki" bolo</span>
  </div>

  <!-- TRANSCRIPT -->
  <div class="transcript" id="transcript">
    <span class="tr-ico">🎙</span>
    <span class="tr-txt" id="trTxt">Wake word "Miki" bolo phir command...</span>
  </div>

  <!-- ROOMS -->
  <div class="sec-lbl">ROOMS</div>
  <div class="card" id="card-bedroom">
    <div class="card-top">
      <div class="room-meta">
        <div class="icon-box" id="ico-bedroom">🛏️</div>
        <div>
          <div class="room-name">Bedroom</div>
          <div class="room-state" id="st-bedroom">Light band hai</div>
        </div>
      </div>
      <button class="toggle" id="tgl-bedroom" onclick="toggleRoom('bedroom')"></button>
    </div>
    <div class="btn-row">
      <button class="act-btn btn-on"  onclick="setRoom('bedroom','ON')">⚡ Jala do</button>
      <button class="act-btn btn-off" onclick="setRoom('bedroom','OFF')">✕ Band karo</button>
    </div>
  </div>

  <!-- TIMERS -->
  <div class="sec-row">
    <div class="sec-lbl" style="margin-bottom:0">SCHEDULES</div>
  </div>
  <button class="timer-add-btn" onclick="openTimerSheet()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Timer add karo (daily alarm jaisa)
  </button>
  <div id="timerList"></div>

</div>

<!-- SETTINGS FAB -->
<div class="fab-wrap">
  <div class="fab" onclick="openSheet('settings')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.6" stroke-linecap="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeSheet()"></div>

<!-- SETTINGS SHEET -->
<div class="sheet" id="sheet-settings">
  <div class="handle"></div>
  <div class="sheet-title">MQTT CONFIG</div>
  <div class="fld"><label>Broker Host</label><input id="cfg-host" placeholder="xxxx.s1.eu.hivemq.cloud"></div>
  <div class="fld"><label>Username</label><input id="cfg-user" placeholder="hivemq_username"></div>
  <div class="fld"><label>Password</label><input id="cfg-pass" type="password" placeholder="••••••••"></div>
  <button class="save-btn" onclick="saveAndConnect()">SAVE &amp; CONNECT</button>
</div>

<!-- TIMER SHEET -->
<div class="sheet" id="sheet-timer">
  <div class="handle"></div>
  <div class="sheet-title">ADD SCHEDULE</div>

  <div class="fld"><label>Room</label>
    <select id="t-room"><option value="bedroom">🛏️ Bedroom</option></select>
  </div>

  <div class="fld"><label>Time</label>
  <div class="time-grid">
    <div class="time-unit"><input type="number" id="t-hr" min="1" max="12" placeholder="08" maxlength="2" oninput="clampTime(this,1,12)"></div>
    <div class="time-colon">:</div>
    <div class="time-unit"><input type="number" id="t-min" min="0" max="59" placeholder="00" maxlength="2" oninput="clampTime(this,0,59)"></div>
    <div></div>
  </div>
  <div class="ampm-btns">
    <button class="ampm-btn sel" id="btn-am" onclick="selAmPm('AM')">AM</button>
    <button class="ampm-btn"     id="btn-pm" onclick="selAmPm('PM')">PM</button>
  </div>
  </div>

  <div class="fld"><label>Action</label>
  <div class="action-btns">
    <button class="action-btn sel-on" id="btn-on"  onclick="selAction('ON')">💡 ON — Jala do</button>
    <button class="action-btn"        id="btn-off" onclick="selAction('OFF')">🌑 OFF — Band karo</button>
  </div>
  </div>

  <button class="save-btn" onclick="saveTimer()">SAVE SCHEDULE</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════
   MIKI BRAIN — v2  (voice fix + timers)
═══════════════════════════════════════════════ */

// ── Config ────────────────────────────────────
let cfg = {
  host: localStorage.getItem('miki_host') || '',
  user: localStorage.getItem('miki_user') || '',
  pass: localStorage.getItem('miki_pass') || '',
};

// ── State ─────────────────────────────────────
const roomState = { bedroom: false };
let mqttClient  = null;
let recog       = null;
let micOn       = false;
let wakeActive  = false;
let cmdTimer    = null;
let toastTimer  = null;
let restarting  = false;
let currentSheet = null;

// ── WAKE WORD VARIANTS ────────────────────────
// en-IN mode mein Google "miki" ko yeh sab sunn sakta hai
const WAKE_WORDS = [
  'miki','mickey','micky','mikki','niki','meeki','michi',
  'mike','mikey','meke','miki-','mikee','miky','meaky',
  'मिकी','मिकि','मिक','मिकि'
];

// ── COMMAND VOCAB (Hinglish) ──────────────────
const VOC_ON  = ['on','jala','jalao','chala','chalo','chalu','on karo','on kar',
                 'start','kholo','켜','light on','lght on','turn on','switch on',
                 'jal','jalo','jala do','on kar do','chalu kar'];
const VOC_OFF = ['off','band','bujha','bujhao','band karo','off karo','off kar',
                 'bandh','rukao','stop','light off','turn off','switch off',
                 'bujha do','band kar','band kar do','off kar do'];
const VOC_ROOM = {
  bedroom: ['bedroom','bed room','bed','kamra','kamre','room','soone','sone','so','bdrm']
};

function isWakeWord(text) {
  const t = text.toLowerCase().trim();
  return WAKE_WORDS.some(w => t.includes(w));
}

function parseCmd(text) {
  const t   = text.toLowerCase();
  const isOn  = VOC_ON.some(w  => t.includes(w));
  const isOff = VOC_OFF.some(w => t.includes(w));
  if (!isOn && !isOff) return null;
  for (const [room, aliases] of Object.entries(VOC_ROOM)) {
    if (aliases.some(a => t.includes(a)))
      return { room, action: isOn ? 'ON' : 'OFF' };
  }
  return { room: 'bedroom', action: isOn ? 'ON' : 'OFF' };
}

// ── MQTT ──────────────────────────────────────
function mqttConnect() {
  if (!cfg.host || !cfg.user || !cfg.pass) { setConnUI('off'); return; }
  if (mqttClient) { try { mqttClient.end(true); } catch(e){} }
  const url = `wss://${cfg.host}:8884/mqtt`;
  const cid = 'miki-pwa-' + Math.random().toString(16).slice(2,8);
  mqttClient = mqtt.connect(url, {
    clientId: cid, username: cfg.user, password: cfg.pass,
    clean: true, reconnectPeriod: 4000, connectTimeout: 8000,
    rejectUnauthorized: false,
  });
  mqttClient.on('connect', () => {
    setConnUI('ok');
    mqttClient.subscribe('miki/bedroom/light/status');
  });
  mqttClient.on('message', (topic, payload) => {
    if (topic === 'miki/bedroom/light/status')
      applyState('bedroom', payload.toString() === 'ON', false);
  });
  mqttClient.on('error',   () => setConnUI('err'));
  mqttClient.on('offline', () => setConnUI('off'));
  mqttClient.on('reconnect', () => { document.getElementById('connTxt').textContent = 'RECONNECTING'; });
}

function pub(topic, payload) {
  if (!mqttClient?.connected) { toast('⚠️ Brain connected nahi'); return false; }
  mqttClient.publish(topic, payload, { qos: 1, retain: true });
  return true;
}

function setConnUI(s) {
  const pill = document.getElementById('connPill');
  const txt  = document.getElementById('connTxt');
  pill.className = 'pill ' + (s==='ok'?'ok':s==='err'?'err':'');
  txt.textContent = s==='ok'?'CONNECTED':s==='err'?'ERROR':'OFFLINE';
}

// ── ROOM CONTROL ──────────────────────────────
function applyState(room, on, send=true) {
  roomState[room] = on;
  document.getElementById(`card-${room}`).className = 'card' + (on?' on':'');
  document.getElementById(`tgl-${room}`).className  = 'toggle' + (on?' on':'');
  document.getElementById(`st-${room}`).textContent = on ? 'Light jali hui hai ✓' : 'Light band hai';
  const card = document.getElementById(`card-${room}`);
  card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
  if (send) {
    const ok = pub(`miki/${room}/light`, on?'ON':'OFF');
    if (ok) toast(on ? `💡 ${room} light jali!` : `🌑 ${room} light band!`);
  }
}
function setRoom(room, action) { applyState(room, action==='ON'); }
function toggleRoom(room)      { applyState(room, !roomState[room]); }

// ── VOICE ─────────────────────────────────────
function initRecog() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Chrome use karo — voice support chahiye'); return false; }

  recog = new SR();
  recog.continuous     = true;
  recog.interimResults = true;
  recog.maxAlternatives= 5;
  // ★ FIX: en-IN use karo — Hinglish + "Miki" sahi se recognize hoga
  recog.lang = 'en-IN';

  recog.onstart  = () => { updateDebug('Listening...'); };
  recog.onresult = handleResult;
  recog.onerror  = e => {
    console.warn('STT error:', e.error);
    if (e.error === 'not-allowed') toast('❌ Mic permission deny hui — browser settings check karo');
    // network/no-speech errors pe auto-restart
  };
  recog.onend = () => {
    if (micOn && !restarting) {
      restarting = true;
      setTimeout(() => {
        restarting = false;
        if (micOn) {
          try { recog.start(); }
          catch(e) { console.warn('Restart err:', e); }
        }
      }, 300);
    }
  };
  return true;
}

function handleResult(e) {
  // Collect all alternatives from all results
  let allTexts = [];
  for (let i = e.resultIndex; i < e.results.length; i++) {
    for (let j = 0; j < e.results[i].length; j++) {
      allTexts.push(e.results[i][j].transcript.toLowerCase().trim());
    }
  }
  const combined = allTexts.join(' ');

  // Show live in debug strip
  updateDebug(allTexts[0] || '...');

  if (!wakeActive) {
    // Check ANY alternative for wake word
    if (allTexts.some(t => isWakeWord(t))) {
      triggerWake();
    }
    return;
  }

  // In wake mode — show in transcript
  showTranscript(allTexts[0]);

  // Try to find command in any alternative (interim = fast, final = accurate)
  let cmd = null;
  for (const t of allTexts) {
    cmd = parseCmd(t);
    if (cmd) break;
  }

  if (cmd) {
    clearTimeout(cmdTimer);
    execCmd(cmd);
    resetWake();
    return;
  }

  // Auto-reset after 5s silence
  clearTimeout(cmdTimer);
  cmdTimer = setTimeout(resetWake, 5000);
}

function triggerWake() {
  wakeActive = true;
  document.getElementById('rippleWrap').classList.add('alive');
  document.getElementById('micBtn').classList.add('wake');
  document.getElementById('waves').classList.add('alive');
  document.getElementById('statusLbl').textContent = 'HAN BOLO...';
  document.getElementById('statusLbl').classList.add('alive');
  document.getElementById('transcript').classList.add('lit');
  updateDebug('Wake word mila! Command bolo...');
  cmdTimer = setTimeout(resetWake, 5000);
}

function resetWake() {
  wakeActive = false;
  clearTimeout(cmdTimer);
  document.getElementById('rippleWrap').classList.remove('alive');
  document.getElementById('micBtn').classList.remove('wake');
  document.getElementById('waves').classList.remove('alive');
  document.getElementById('statusLbl').textContent = micOn ? 'SAY "MIKI" ...' : 'TAP TO START';
  document.getElementById('statusLbl').classList.remove('alive');
  document.getElementById('transcript').classList.remove('lit');
  showTranscript('');
}

function execCmd(cmd) { applyState(cmd.room, cmd.action==='ON'); }

function updateDebug(text) {
  document.getElementById('debugTxt').textContent = text;
}

function showTranscript(text) {
  const el = document.getElementById('trTxt');
  if (text) { el.textContent = text; el.className = 'tr-txt has'; }
  else       { el.textContent = 'Wake word "Miki" bolo phir command...'; el.className = 'tr-txt'; }
}

function toggleMic() {
  if (!recog && !initRecog()) return;
  micOn = !micOn;
  if (micOn) {
    try { recog.start(); } catch(e) {}
    document.getElementById('micBtn').classList.remove('off');
    document.getElementById('statusLbl').textContent = 'SAY "MIKI" ...';
    toast('🎤 Miki sun raha hai — "Miki light on" bolo');
  } else {
    recog.abort();
    document.getElementById('micBtn').classList.add('off');
    resetWake();
    updateDebug('Mic off hai');
  }
}

// ── TIMERS ────────────────────────────────────
let timers = JSON.parse(localStorage.getItem('miki_timers') || '[]');
let timerAmPm   = 'AM';
let timerAction = 'ON';

function saveTimers() {
  localStorage.setItem('miki_timers', JSON.stringify(timers));
}

function renderTimers() {
  const list = document.getElementById('timerList');
  if (timers.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:12px;padding:10px 0 20px">Koi schedule nahi hai abhi</div>';
    return;
  }
  list.innerHTML = timers.map((t, i) => `
    <div class="timer-card ${t.enabled ? 'active-timer' : ''}" id="tcard-${i}">
      <div class="timer-info" style="flex:0 0 auto">
        <div class="timer-time">${t.hr}:${t.min} <span class="timer-ampm">${t.ampm}</span></div>
      </div>
      <div class="timer-info">
        <div class="timer-room">${t.room}</div>
        <span class="timer-action ${t.action==='ON'?'on-badge':'off-badge'}">
          ${t.action==='ON'?'💡 JALA DO':'🌑 BAND KAR'}
        </span>
      </div>
      <button class="timer-toggle ${t.enabled?'on':''}" onclick="toggleTimer(${i})" title="Enable/Disable"></button>
      <button class="timer-del" onclick="deleteTimer(${i})" title="Delete">✕</button>
    </div>
  `).join('');
}

function toggleTimer(i) {
  timers[i].enabled = !timers[i].enabled;
  saveTimers(); renderTimers();
  toast(timers[i].enabled ? '✅ Schedule active' : '⏸ Schedule paused');
}

function deleteTimer(i) {
  timers.splice(i, 1);
  saveTimers(); renderTimers();
  toast('🗑 Schedule hata diya');
}

// Check timers every 30 seconds
function checkTimers() {
  const now = new Date();
  const h   = now.getHours();
  const m   = now.getMinutes();

  timers.forEach(t => {
    if (!t.enabled) return;
    let th = parseInt(t.hr);
    if (t.ampm === 'PM' && th !== 12) th += 12;
    if (t.ampm === 'AM' && th === 12) th = 0;
    const tm = parseInt(t.min);
    if (h === th && m === tm) {
      // Avoid firing twice in same minute
      const key = `miki_fired_${t.id}`;
      const lastFired = localStorage.getItem(key);
      const nowKey    = `${now.getDate()}-${h}-${m}`;
      if (lastFired !== nowKey) {
        localStorage.setItem(key, nowKey);
        applyState(t.room, t.action === 'ON');
        toast(`⏰ Schedule: ${t.room} light ${t.action === 'ON' ? 'jali' : 'band'}!`);
      }
    }
  });
}

// Timer sheet
function selAmPm(v) {
  timerAmPm = v;
  document.getElementById('btn-am').className = 'ampm-btn' + (v==='AM'?' sel':'');
  document.getElementById('btn-pm').className = 'ampm-btn' + (v==='PM'?' sel':'');
}

function selAction(v) {
  timerAction = v;
  document.getElementById('btn-on').className  = 'action-btn' + (v==='ON'?' sel-on':'');
  document.getElementById('btn-off').className = 'action-btn' + (v==='OFF'?' sel-off':'');
}

function clampTime(el, mn, mx) {
  let v = parseInt(el.value);
  if (isNaN(v)) return;
  if (v < mn) el.value = mn;
  if (v > mx) el.value = mx;
}

function saveTimer() {
  const hr  = document.getElementById('t-hr').value.trim();
  const min = document.getElementById('t-min').value.trim();
  const room= document.getElementById('t-room').value;

  if (!hr || !min) { toast('⚠️ Time daalo pehle'); return; }

  const pad = n => String(n).padStart(2,'0');
  timers.push({
    id:      Date.now(),
    room,
    hr:      pad(hr),
    min:     pad(min),
    ampm:    timerAmPm,
    action:  timerAction,
    enabled: true,
  });
  saveTimers();
  renderTimers();
  closeSheet();

  const h12 = pad(hr), ampm = timerAmPm;
  toast(`⏰ Schedule set: ${room} ${timerAction} at ${h12}:${pad(min)} ${ampm}`);
}

function openTimerSheet() {
  // Reset form
  document.getElementById('t-hr').value  = '';
  document.getElementById('t-min').value = '';
  selAmPm('AM'); selAction('ON');
  openSheet('timer');
}

// ── SHEETS ────────────────────────────────────
function openSheet(name) {
  if (currentSheet) document.getElementById(`sheet-${currentSheet}`).classList.remove('open');
  currentSheet = name;
  if (name === 'settings') {
    document.getElementById('cfg-host').value = cfg.host;
    document.getElementById('cfg-user').value = cfg.user;
    document.getElementById('cfg-pass').value = cfg.pass;
  }
  document.getElementById(`sheet-${name}`).classList.add('open');
  document.getElementById('overlay').classList.add('show');
}

function closeSheet() {
  if (currentSheet) document.getElementById(`sheet-${currentSheet}`).classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  currentSheet = null;
}

function saveAndConnect() {
  cfg.host = document.getElementById('cfg-host').value.trim();
  cfg.user = document.getElementById('cfg-user').value.trim();
  cfg.pass = document.getElementById('cfg-pass').value.trim();
  localStorage.setItem('miki_host', cfg.host);
  localStorage.setItem('miki_user', cfg.user);
  localStorage.setItem('miki_pass', cfg.pass);
  closeSheet();
  mqttConnect();
  toast('✅ Saved! Connecting...');
}

// ── TOAST ─────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ── INIT ──────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  mqttConnect();
  renderTimers();
  setInterval(checkTimers, 30000);
  checkTimers(); // immediate check on open

  if (!cfg.host) {
    setTimeout(() => openSheet('settings'), 700);
    toast('⚙️ Pehle MQTT config set karo');
  }

  // Auto-start mic
  setTimeout(() => { if (!micOn) toggleMic(); }, 800);
});
</script>
</body>
</html>
